appId: 'kr.dreamcraft.alicegameland.launcher'
productName: '앨리스의 게임랜드'
artifactName: '${productName}-setup-${version}.${ext}'

copyright: 'Copyright © 2026 JooHwan Kim. Helios Launcher © Daniel Scalzi.'

asar: true
compression: 'maximum'

files:
  - '!{dist,.gitignore,.vscode,docs,dev-app-update.yml,.nvmrc,eslint.config.mjs}'

extraResources:
  - 'libraries'

# Windows Configuration
win: 
  icon: 'build/icon.ico'
  target: 
    - target: 'nsis'
      arch: 'x64'

# Windows Installer Configuration
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true

# macOS Configuration
mac:
  target:
    - target: 'dmg'
      arch:
        - 'x64'
        - 'arm64'
  artifactName: '${productName}-setup-${version}-${arch}.${ext}'
  category: 'public.app-category.games'

# Linux Configuration
linux: 
  icon: 'build/icon.png'
  target: 'AppImage'
  maintainer: 'JooHwan Kim'
  vendor: 'Alice GameLand'
  synopsis: '앨리스의 게임랜드 Minecraft 런처'
  description: 'Minecraft 26.2와 NeoForge 클라이언트를 자동으로 설치하고 업데이트합니다.'
  category: 'Game'


directories:
  buildResources: 'build'
  output: 'dist'
